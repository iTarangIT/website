<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">Electric light goods vehicle battery planning in Delhi-NCR</title>
  <desc id="coverDesc">An electric cargo van on a Delhi-NCR delivery route, plugged into a depot charger, with a battery state-of-charge gauge showing a planned daily reserve.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#011a2a"/>
      <stop offset="0.55" stop-color="#02314e"/>
      <stop offset="1" stop-color="#165e73"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9eaf7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#90d4ef"/>
      <stop offset="1" stop-color="#2e68b2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>

  <!-- faint depot grid -->
  <g stroke="#38bdf8" stroke-opacity="0.07" stroke-width="2">
    <path d="M0 135h1200M0 270h1200M0 405h1200M0 540h1200"/>
    <path d="M150 0v675M300 0v675M450 0v675M600 0v675M750 0v675M900 0v675M1050 0v675"/>
  </g>

  <!-- NCR skyline -->
  <g fill="#0d4a5e" fill-opacity="0.55">
    <rect x="40" y="392" width="70" height="120"/>
    <rect x="122" y="430" width="46" height="82"/>
    <rect x="180" y="356" width="58" height="156"/>
    <rect x="960" y="372" width="64" height="140"/>
    <rect x="1036" y="418" width="50" height="94"/>
    <rect x="1098" y="344" width="62" height="168"/>
  </g>
  <g fill="#38bdf8" fill-opacity="0.35">
    <rect x="56" y="410" width="12" height="14"/><rect x="80" y="410" width="12" height="14"/>
    <rect x="56" y="444" width="12" height="14"/><rect x="80" y="444" width="12" height="14"/>
    <rect x="196" y="378" width="12" height="14"/><rect x="216" y="378" width="12" height="14"/>
    <rect x="976" y="394" width="12" height="14"/><rect x="998" y="394" width="12" height="14"/>
    <rect x="1114" y="366" width="12" height="14"/><rect x="1134" y="366" width="12" height="14"/>
  </g>

  <!-- delivery route across the NCR -->
  <path d="M110 168 C 300 96, 420 232, 610 168 S 930 96, 1090 176"
        fill="none" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="22 16"/>
  <g fill="#02314e" stroke="#38bdf8" stroke-width="5">
    <circle cx="110" cy="168" r="12"/>
    <circle cx="420" cy="188" r="12"/>
    <circle cx="760" cy="132" r="12"/>
    <circle cx="1090" cy="176" r="12"/>
  </g>
  <circle cx="610" cy="168" r="16" fill="#10b981" stroke="#e8f6fc" stroke-width="5"/>

  <!-- depot charger -->
  <rect x="196" y="352" width="76" height="176" rx="16" fill="#0d4a5e" stroke="#38bdf8" stroke-width="4"/>
  <rect x="212" y="372" width="44" height="52" rx="8" fill="#02314e" stroke="#38bdf8" stroke-width="3"/>
  <path d="M238 380l-16 26h12l-6 22 18-28h-12z" fill="#10b981"/>
  <rect x="212" y="444" width="44" height="8" rx="4" fill="#38bdf8" fill-opacity="0.6"/>
  <rect x="212" y="462" width="30" height="8" rx="4" fill="#38bdf8" fill-opacity="0.35"/>

  <!-- charging cable into the van's port -->
  <path d="M272 436 C 330 500, 388 478, 432 440" fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
  <rect x="424" y="418" width="18" height="34" rx="6" fill="#10b981"/>

  <!-- electric light goods vehicle -->
  <ellipse cx="700" cy="556" rx="300" ry="20" fill="#011a2a" fill-opacity="0.55"/>
  <rect x="446" y="318" width="372" height="200" rx="10" fill="url(#body)"/>
  <path d="M812 334h58l50 72v112h-108z" fill="#e8f6fc"/>
  <path d="M828 350h34l38 54h-72z" fill="url(#glass)"/>
  <rect x="446" y="318" width="372" height="16" rx="8" fill="#90d4ef"/>
  <rect x="898" y="434" width="24" height="24" rx="7" fill="#38bdf8"/>
  <rect x="886" y="486" width="36" height="22" rx="7" fill="#165e73"/>
  <rect x="434" y="470" width="16" height="44" rx="6" fill="#165e73"/>
  <rect x="446" y="508" width="476" height="18" rx="6" fill="#165e73"/>

  <!-- state of charge on the cargo body: three days' charge, one segment held as reserve -->
  <rect x="498" y="378" width="252" height="86" rx="14" fill="#02314e" fill-opacity="0.92"/>
  <rect x="750" y="406" width="14" height="30" rx="4" fill="#02314e" fill-opacity="0.92"/>
  <rect x="516" y="396" width="48" height="50" rx="7" fill="#10b981"/>
  <rect x="572" y="396" width="48" height="50" rx="7" fill="#10b981"/>
  <rect x="628" y="396" width="48" height="50" rx="7" fill="#10b981"/>
  <rect x="684" y="396" width="48" height="50" rx="7" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- wheels -->
  <g>
    <circle cx="540" cy="532" r="46" fill="#011a2a"/>
    <circle cx="540" cy="532" r="20" fill="#90d4ef"/>
    <circle cx="858" cy="532" r="46" fill="#011a2a"/>
    <circle cx="858" cy="532" r="20" fill="#90d4ef"/>
  </g>

  <!-- ground -->
  <rect x="0" y="576" width="1200" height="99" fill="#011a2a" fill-opacity="0.6"/>
  <path d="M0 576h1200" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="4"/>
  <g stroke="#38bdf8" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round">
    <path d="M60 626h84M200 626h84M340 626h84M480 626h84M620 626h84M760 626h84M900 626h84M1040 626h84"/>
  </g>
</svg>
